<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Mes commandes — Pure Essence Vita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/checkout.css" />
  <link rel="stylesheet" href="css/chatbot.css" />
</head>
<body>
  <div class="announcement"><p>Historique & suivi de vos commandes</p></div>
  <header class="header is-scrolled">
    <div class="container header__inner header__inner--simple">
      <a href="index.html" class="brand">
        <img src="logo/2608843d-81e3-494b-9808-d60e0ec10072.jpeg" alt="Pure Essence Vita" class="brand__logo" />
      </a>
      <div class="header-links">
        <a href="suivi.html">Suivre un colis</a>
        <a href="index.html" class="btn btn--ghost btn--sm">Boutique</a>
      </div>
    </div>
  </header>

  <main class="track-page">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow">Espace client</p>
        <h1 class="section-title">Mes commandes</h1>
        <p class="section-desc">Retrouvez vos commandes avec votre téléphone ou email utilisé au checkout.</p>
      </div>

      <form class="track-search" id="ordersSearch">
        <input id="ordersPhone" type="tel" placeholder="Téléphone" />
        <input id="ordersEmail" type="email" placeholder="Email" />
        <button class="btn btn--gold" type="submit">Rechercher</button>
      </form>

      <div id="ordersList" class="orders-list"></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/store.js"></script>
  <script>
    (function () {
      const $ = (s) => document.querySelector(s);
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("is-show");
        setTimeout(() => t.classList.remove("is-show"), 2400);
      }

      function render(orders) {
        const box = $("#ordersList");
        if (!orders.length) {
          box.innerHTML = `<div class="track-card"><p>Aucune commande trouvée. <a href="index.html#produits">Continuer vos achats</a></p></div>`;
          return;
        }
        box.innerHTML = orders
          .map(
            (o) => `
          <a class="order-row" href="suivi.html?id=${encodeURIComponent(o.id)}">
            <div>
              <strong>${o.id}</strong>
              <span>${PEV.formatDate(o.createdAt)} · ${o.items?.length || 0} article(s)</span>
            </div>
            <div class="order-row__right">
              <span class="track-status-pill">${PEV.STATUS_LABELS[o.status] || o.status}</span>
              <strong>${PEV.formatPrice(o.total)}</strong>
            </div>
          </a>`
          )
          .join("");
      }

      async function loadLocalFirst() {
        const local = JSON.parse(localStorage.getItem("pev_orders_v1") || "[]");
        if (local.length) render(local);
        try {
          const all = await PEV.listOrders();
          if (all.length) render(all);
        } catch (_) {}
      }

      $("#ordersSearch").addEventListener("submit", async (e) => {
        e.preventDefault();
        const phone = $("#ordersPhone").value.trim();
        const email = $("#ordersEmail").value.trim();
        if (!phone && !email) return toast("Entrez un téléphone ou un email");
        const orders = await PEV.searchOrders({ phone, email });
        render(orders);
        if (!orders.length) toast("Aucune commande trouvée");
      });

      // Prefill from last customer
      try {
        const saved = JSON.parse(localStorage.getItem("pev_last_customer") || "null");
        if (saved) {
          $("#ordersPhone").value = saved.phone || "";
          $("#ordersEmail").value = saved.email || "";
        }
      } catch (_) {}

      loadLocalFirst();
    })();
  </script>
  <script src="js/chatbot.js"></script>
</body>
</html>
