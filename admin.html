<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Admin livraison — Pure Essence Vita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/checkout.css" />
</head>
<body>
  <div class="announcement"><p>Espace admin — mise à jour des statuts de livraison</p></div>
  <header class="header is-scrolled">
    <div class="container header__inner header__inner--simple">
      <a href="index.html" class="brand">
        <img src="logo/2608843d-81e3-494b-9808-d60e0ec10072.jpeg" alt="Pure Essence Vita" class="brand__logo" />
      </a>
      <a href="index.html" class="btn btn--ghost btn--sm">Boutique</a>
    </div>
  </header>

  <main class="track-page">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow">Gestion</p>
        <h1 class="section-title">Commandes & livraison</h1>
        <p class="section-desc">Faites avancer chaque commande comme sur AliExpress : préparation → expédition → transit → livraison.</p>
      </div>

      <div class="admin-login track-card" id="adminGate">
        <label for="adminPass">Mot de passe admin</label>
        <div class="track-search" style="margin:0">
          <input id="adminPass" type="password" placeholder="Mot de passe" />
          <button class="btn btn--gold" type="button" id="adminEnter">Entrer</button>
        </div>
        <p class="muted" style="margin-top:0.75rem">Par défaut : <code>pev_admin_2026</code> (modifiable dans api/orders.php et js/store.js)</p>
      </div>

      <div id="adminPanel" hidden>
        <div class="admin-toolbar">
          <button class="btn btn--ghost btn--sm" id="refreshOrders">Actualiser</button>
        </div>
        <div id="adminOrders" class="orders-list"></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/store.js"></script>
  <script>
    (function () {
      const $ = (s) => document.querySelector(s);
      const NEXT = {
        pending_payment: "paid",
        paid: "processing",
        processing: "shipped",
        shipped: "in_transit",
        in_transit: "out_for_delivery",
        out_for_delivery: "delivered",
        delivered: "completed",
      };

      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("is-show");
        setTimeout(() => t.classList.remove("is-show"), 2400);
      }

      async function render() {
        const orders = await PEV.listOrders();
        const box = $("#adminOrders");
        if (!orders.length) {
          box.innerHTML = `<div class="track-card"><p>Aucune commande pour le moment.</p></div>`;
          return;
        }
        box.innerHTML = orders
          .map((o) => {
            const next = NEXT[o.status];
            return `
            <div class="track-card admin-order">
              <div class="track-card__head">
                <div>
                  <h3>${o.id}</h3>
                  <p class="muted">${o.customer?.name || ""} · ${o.customer?.phone || ""} · ${PEV.formatDate(o.createdAt)}</p>
                </div>
                <span class="track-status-pill">${PEV.STATUS_LABELS[o.status]}</span>
              </div>
              <p><strong>${PEV.formatPrice(o.total)}</strong> · ${o.items?.length || 0} article(s) · ${o.trackingNumber}</p>
              <div class="admin-actions">
                ${
                  next
                    ? `<button class="btn btn--gold btn--sm" data-advance="${o.id}" data-next="${next}">Passer à : ${PEV.STATUS_LABELS[next]}</button>`
                    : `<span class="success-inline">Cycle terminé</span>`
                }
                <a class="btn btn--ghost btn--sm" href="suivi.html?id=${encodeURIComponent(o.id)}" target="_blank">Voir suivi</a>
              </div>
            </div>`;
          })
          .join("");

        box.querySelectorAll("[data-advance]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.advance;
            const status = btn.dataset.next;
            btn.disabled = true;
            try {
              await PEV.updateStatus(id, status, `Mise à jour admin → ${PEV.STATUS_LABELS[status]}`);
              toast("Statut mis à jour");
              render();
            } catch (e) {
              toast("Erreur de mise à jour");
              btn.disabled = false;
            }
          });
        });
      }

      $("#adminEnter").addEventListener("click", () => {
        if ($("#adminPass").value !== PEV.ADMIN_KEY) {
          toast("Mot de passe incorrect");
          return;
        }
        sessionStorage.setItem("pev_admin_ok", "1");
        $("#adminGate").hidden = true;
        $("#adminPanel").hidden = false;
        render();
      });

      $("#refreshOrders")?.addEventListener("click", render);

      if (sessionStorage.getItem("pev_admin_ok") === "1") {
        $("#adminGate").hidden = true;
        $("#adminPanel").hidden = false;
        render();
      }
    })();
  </script>
</body>
</html>
