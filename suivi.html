<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Suivi de commande — Pure Essence Vita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/checkout.css" />
</head>
<body>
  <div class="announcement">
    <p>Suivez votre colis du paiement jusqu'à la validation de livraison</p>
  </div>
  <header class="header is-scrolled">
    <div class="container header__inner header__inner--simple">
      <a href="index.html" class="brand">
        <img src="logo/2608843d-81e3-494b-9808-d60e0ec10072.jpeg" alt="Pure Essence Vita" class="brand__logo" />
      </a>
      <div class="header-links">
        <a href="commandes.html">Mes commandes</a>
        <a href="index.html#produits" class="btn btn--ghost btn--sm">Boutique</a>
      </div>
    </div>
  </header>

  <main class="track-page">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow">Suivi</p>
        <h1 class="section-title">Où en est ma commande ?</h1>
        <p class="section-desc">Entrez votre numéro de commande (PEV-…) ou votre numéro de suivi (TRK…).</p>
      </div>

      <form class="track-search" id="trackForm">
        <input id="trackQuery" type="search" placeholder="Ex. PEV-XXXX ou TRKXXXXXXXXXX" required />
        <button class="btn btn--gold" type="submit">Suivre</button>
      </form>

      <div id="trackResult" hidden></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/store.js"></script>
  <script src="js/tracking.js"></script>
</body>
</html>
